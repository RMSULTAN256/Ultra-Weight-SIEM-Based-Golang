version: '3.8'

services:
  # ==========================================
  # 1. SIEM Central Collector & Dashboard
  # ==========================================
  center-siem:
    build:
      context: ./CenterServer
      dockerfile: Dockerfile
    container_name: center-siem
    ports:
      - "8085:8082"
    environment:
      - PORT=8082
      - DB_PATH=/CenterServer/siem.db
    volumes:
      - center_data:/app/data
    networks:
      - siem-network
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: web-nginx
    restart: always
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - center-siem
    networks:
      - siem-network
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel-cf
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiZTAyNTc2MDQwNmU2OWRjOGZlMmRmY2IyMjE0NDFiMjkiLCJ0IjoiYzc1YjdiZDctZGU0Zi00YWFmLTk0MzAtYmVjNzdhOWNlOTZlIiwicyI6Ik5qUXlNemxtTTJRdE56STBZeTAwT0RGbUxUazJPR1l0WlRJd1lXSmtPR0V5TURReiJ9
    depends_on:
      - nginx
    networks:
      - siem-network

  # ==========================================
  # 2. Node Agent 1 (Auth Service)
  # ==========================================
  web-node-1:
    build:
      context: ./Client/server-1
      dockerfile: Dockerfile
    container_name: web-node-1
    ports:
      - "3001:3000"
    volumes:
      - web1_logs:/app/logs
    networks:
      - siem-network
    restart: unless-stopped

  agent-node-1:
    build:
      context: ./Client/agent
      dockerfile: Dockerfile
    container_name: agent-node-1
    hostname: web-auth-01
    environment:
      - AUTH_SERVER_URL=http://center-siem:8082/api/v1/agent/heartbeat
      - RAM_LIMIT_MB=512
      - LOG_PATH=/var/log/app/app.log
    mem_limit: 512m
    volumes:
      - web1_logs:/var/log/app:ro
    depends_on:
      - center-siem
      - web-node-1
    networks:
      - siem-network
    restart: unless-stopped

  # ==========================================
  # 3. Node Agent 2 (Catalog Service)
  # ==========================================
  web-node-2:
    build:
      context: ./Client/server-2
      dockerfile: Dockerfile
    container_name: web-node-2
    ports:
      - "3002:3000"
    volumes:
      - web2_logs:/app/logs
    networks:
      - siem-network
    restart: unless-stopped

  agent-node-2:
    build:
      context: ./Client/agent
      dockerfile: Dockerfile
    container_name: agent-node-2
    hostname: api-catalog-02
    environment:
      - AUTH_SERVER_URL=http://center-siem:8082/api/v1/agent/heartbeat
      - RAM_LIMIT_MB=1024
      - LOG_PATH=/var/log/app/app.log
    mem_limit: 1024m
    volumes:
      - web2_logs:/var/log/app:ro
    depends_on:
      - center-siem
      - web-node-2
    networks:
      - siem-network
    restart: unless-stopped

  # ==========================================
  # 4. Node Agent 3 (Order Service)
  # ==========================================
  web-node-3:
    build:
      context: ./Client/server-3
      dockerfile: Dockerfile
    container_name: web-node-3
    ports:
      - "3003:3000"
    volumes:
      - web3_logs:/app/logs
    networks:
      - siem-network
    restart: unless-stopped

  agent-node-3:
    build:
      context: ./Client/agent
      dockerfile: Dockerfile
    container_name: agent-node-3
    hostname: order-service-03
    environment:
      - AUTH_SERVER_URL=http://center-siem:8082/api/v1/agent/heartbeat
      - RAM_LIMIT_MB=1024
      - LOG_PATH=/var/log/app/app.log
    mem_limit: 1024m
    volumes:
      - web3_logs:/var/log/app:ro
    depends_on:
      - center-siem
      - web-node-3
    networks:
      - siem-network
    restart: unless-stopped

volumes:
  center_data:
  web1_logs:
  web2_logs:
  web3_logs:

networks:
  siem-network:
    driver: bridge
