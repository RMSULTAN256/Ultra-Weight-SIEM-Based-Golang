<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wazuh-Lean Mini-SIEM SOC</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #152238 0%, #090d15 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
      padding: 36px 30px;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: rgba(0, 164, 228, 0.1);
      border: 1px solid rgba(0, 164, 228, 0.3);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .auth-title span {
      color: var(--wazuh-blue);
    }

    .auth-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 11px 13px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--wazuh-blue);
      box-shadow: 0 0 0 2px rgba(0, 164, 228, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--wazuh-blue), #007bb5);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: filter 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-box {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-box.error {
      display: flex;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-box.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #86efac;
    }

    .auth-footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body class="login-page">

  <div class="auth-card">
    <!-- Header Branding -->
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00a4e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="auth-title">WAZUH <span>LEAN</span></div>
      <div class="auth-subtitle">SOC Console Access Gateway</div>
    </div>

    <!-- Alert Box Notifikasi -->
    <div id="alertBox" class="alert-box"></div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username</label>
        <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnSubmitLogin" class="btn-submit">Masuk ke SOC Dashboard</button>
    </form>

    <div class="auth-footer-note">
      🔒 Authorized Personnel Only • Protected by Zero-Trust
      <div style="margin-top: 8px; color: #64748b; font-size: 11px; font-family: var(--font-mono);">
        Demo Credentials: <strong style="color: #38bdf8;">admin</strong> / <strong style="color: #38bdf8;">admin123</strong>
      </div>
    </div>
  </div>

  <script>
    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box ' + type;
      box.textContent = (type === 'error' ? '⚠️ ' : '✅ ') + message;
      box.style.display = 'flex';
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      clearAlert();

      const btn = document.getElementById('btnSubmitLogin');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();

        if (!resp.ok) {
          showAlert(data.error || 'Username atau password salah', 'error');
          return;
        }

        showAlert('Login berhasil! Mengalihkan ke dashboard...', 'success');

        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', data.username);
        localStorage.setItem('auth_role', data.role);

        setTimeout(() => {
          window.location.href = '/';
        }, 500);

      } catch (err) {
        showAlert('Gagal terhubung ke server SIEM: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk ke SOC Dashboard';
      }
    }

    // Auto-redirect jika sudah ada sesi login aktif
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('auth_token')) {
        showAlert('Sesi aktif terdeteksi. Mengalihkan ke dashboard...', 'success');
        setTimeout(() => { window.location.href = '/'; }, 400);
      }
    });
  </script>
</body>
</html>
