<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Mini-SIEM 16-Bit SOC</title>
  <link rel="stylesheet" href="/pixel-theme.css?v=1.0">
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .auth-island-card {
      width: 100%;
      max-width: 400px;
      animation: float-island 5s ease-in-out infinite;
    }

    .alert-box {
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      margin-bottom: 16px;
      border: 2px solid var(--pixel-border-color);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-box.error {
      display: flex;
      background: var(--pixel-danger-bg);
      color: var(--pixel-danger);
    }

    .alert-box.success {
      display: flex;
      background: var(--pixel-success-bg);
      color: var(--pixel-success);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pixel-form-input {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid var(--pixel-border-color);
      box-shadow: 2px 2px 0 0 rgba(15, 23, 42, 0.2);
      padding: 10px 12px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
    }

    .pixel-form-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 2px 2px 0 var(--pixel-border-color);
    }
  </style>
</head>
<body class="login-page">

  <div class="island-card auth-island-card active-panel">
    <!-- Top Grass Header -->
    <div class="island-grass-cap"></div>

    <div class="island-inner" style="padding: 28px 24px;">
      <!-- Branding Logo & Title -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-island-icon" style="margin: 0 auto 12px auto; width: 44px; height: 44px;">
          <div class="brand-icon-grass" style="height: 12px;"></div>
          <div class="brand-icon-core" style="font-size: 13px;">16b</div>
          <div class="brand-icon-dirt" style="height: 12px;"></div>
        </div>
        <div class="brand-title" style="font-size: 16px;">MINI-SIEM <span>SOC</span></div>
        <div class="brand-badge" style="font-size: 10px; margin-top: 4px;">CONSOLE ACCESS GATEWAY</div>
      </div>

      <!-- Alert Notification Box -->
      <div id="alertBox" class="alert-box"></div>

      <!-- Form Login -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginUsername">USERNAME / PENGGUNA</label>
          <input type="text" id="loginUsername" class="pixel-form-input" placeholder="Masukkan username" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">PASSWORD / KATA SANDI</label>
          <input type="password" id="loginPassword" class="pixel-form-input" placeholder="Masukkan password" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnSubmitLogin" class="pixel-btn pixel-btn-cyan" style="width: 100%; padding: 12px; font-size: 11px; margin-top: 8px;">
          <span>MASUK MISI SOC &rarr;</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-muted);">
        🔒 Zero-Trust Telemetry Protected &bull; Polibatam TA
      </div>
    </div>

    <!-- Bottom Dirt/Rock Crust -->
    <div class="island-dirt-crust"></div>
  </div>

  <script>
    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box ' + type;
      box.textContent = (type === 'error' ? '⚠️ ' : '✅ ') + message;
      box.style.display = 'flex';
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    const AUTH_KEYS = ['auth_token', 'auth_user', 'auth_role'];

    function decodeJwtPayload(t) {
      try {
        const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const pad = b + '='.repeat((4 - (b.length % 4)) % 4);
        const raw = atob(pad);
        let out = '';
        for (let i = 0; i < raw.length; i++) {
          out += '%' + ('00' + raw.charCodeAt(i).toString(16)).slice(-2);
        }
        return JSON.parse(decodeURIComponent(out));
      } catch (_) {
        return null;
      }
    }

    function getValidToken() {
      const t = localStorage.getItem('auth_token');
      if (!t) return null;
      const p = decodeJwtPayload(t);
      if (!p) return null;
      if (typeof p.exp === 'number' && p.exp * 1000 <= Date.now()) return null;
      return t;
    }

    function clearSession() {
      AUTH_KEYS.forEach(k => localStorage.removeItem(k));
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      clearAlert();

      const btn = document.getElementById('btnSubmitLogin');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<span>MEMVERIFIKASI...</span>';

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (resp.status === 429) {
          showAlert('Terlalu banyak percobaan login. Tunggu 1 menit lalu coba lagi.', 'error');
          return;
        }

        let data = {};
        try { data = await resp.json(); } catch (_) {}

        if (!resp.ok) {
          showAlert(data.error || 'Username atau password salah', 'error');
          return;
        }

        if (!data.token) {
          showAlert('Respons server tidak berisi token JWT.', 'error');
          return;
        }

        clearSession();
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', data.username || username);
        localStorage.setItem('auth_role', (data.role || 'analyst').toLowerCase());

        showAlert('Autentikasi berhasil! Mengalihkan ke dashboard...', 'success');
        setTimeout(() => { window.location.replace('/dashboard'); }, 500);

      } catch (err) {
        showAlert('Gagal terhubung ke server SIEM: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>MASUK MISI SOC &rarr;</span>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const reason = new URLSearchParams(window.location.search).get('reason');

      if (reason === 'expired') {
        clearSession();
        showAlert('Sesi Anda sudah berakhir. Silakan login kembali.', 'error');
        return;
      }
      if (reason === 'logout') {
        clearSession();
        showAlert('Anda telah keluar dari sistem.', 'success');
        return;
      }

      if (getValidToken()) {
        showAlert('Sesi aktif terdeteksi. Mengalihkan ke dashboard...', 'success');
        setTimeout(() => { window.location.replace('/dashboard'); }, 400);
      } else {
        clearSession();
      }
    });
  </script>
</body>
</html>
