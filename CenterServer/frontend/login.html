<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wazuh-Lean Mini-SIEM SOC</title>
  <link rel="stylesheet" href="/style.css?v=3.3">
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-app);
      font-family: var(--font-sans);
      margin: 0;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 32px 28px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--primary-subtle);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .auth-title span {
      color: var(--primary);
    }

    .auth-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .alert-box {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-box.error {
      display: flex;
      background: var(--color-danger-bg);
      border: 1px solid var(--color-danger-border);
      color: #fca5a5;
    }

    .alert-box.success {
      display: flex;
      background: var(--color-success-bg);
      border: 1px solid var(--color-success-border);
      color: #86efac;
    }

    .auth-footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: var(--text-dim);
    }
  </style>
</head>
<body class="login-page">

  <div class="auth-card">
    <!-- Header Branding -->
    <div class="auth-header">
      <div class="auth-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="auth-title">WAZUH <span>LEAN</span></div>
      <div class="auth-subtitle">SOC Console Access Gateway</div>
    </div>

    <!-- Alert Box Notifikasi -->
    <div id="alertBox" class="alert-box"></div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username</label>
        <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnSubmitLogin" class="btn-submit">Masuk ke SOC Dashboard</button>
    </form>

    <div class="auth-footer-note">
      🔒 Authorized Personnel Only • Protected by Zero-Trust
    </div>
  </div>

  <script>
    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box ' + type;
      box.textContent = (type === 'error' ? '⚠️ ' : '✅ ') + message;
      box.style.display = 'flex';
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    const AUTH_KEYS = ['auth_token', 'auth_user', 'auth_role'];

    function decodeJwtPayload(t) {
      try {
        const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const pad = b + '='.repeat((4 - (b.length % 4)) % 4);
        const raw = atob(pad);
        let out = '';
        for (let i = 0; i < raw.length; i++) {
          out += '%' + ('00' + raw.charCodeAt(i).toString(16)).slice(-2);
        }
        return JSON.parse(decodeURIComponent(out));
      } catch (_) {
        return null;
      }
    }

    // Token kedaluwarsa harus dianggap tidak ada. Tanpa ini, halaman login
    // akan terus melempar user ke dashboard yang sudah tidak bisa memuat data.
    function getValidToken() {
      const t = localStorage.getItem('auth_token');
      if (!t) return null;
      const p = decodeJwtPayload(t);
      if (!p) return null;
      if (typeof p.exp === 'number' && p.exp * 1000 <= Date.now()) return null;
      return t;
    }

    function clearSession() {
      AUTH_KEYS.forEach(k => localStorage.removeItem(k));
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      clearAlert();

      const btn = document.getElementById('btnSubmitLogin');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        // Rate limit: backend membalas 429 setelah 5 percobaan / menit
        if (resp.status === 429) {
          showAlert('Terlalu banyak percobaan login. Tunggu 1 menit lalu coba lagi.', 'error');
          return;
        }

        let data = {};
        try { data = await resp.json(); } catch (_) { /* respons bukan JSON */ }

        if (!resp.ok) {
          showAlert(data.error || 'Username atau password salah', 'error');
          return;
        }

        if (!data.token) {
          showAlert('Respons server tidak berisi token.', 'error');
          return;
        }

        clearSession();
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', data.username || username);
        localStorage.setItem('auth_role', (data.role || 'analyst').toLowerCase());

        showAlert('Login berhasil! Mengalihkan ke dashboard...', 'success');

        setTimeout(() => { window.location.replace('/'); }, 500);

      } catch (err) {
        showAlert('Gagal terhubung ke server SIEM: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk ke SOC Dashboard';
      }
    }

    // Auto-redirect hanya kalau sesi masih sah
    window.addEventListener('DOMContentLoaded', () => {
      const reason = new URLSearchParams(window.location.search).get('reason');

      if (reason === 'expired') {
        clearSession();
        showAlert('Sesi Anda sudah berakhir. Silakan login kembali.', 'error');
        return;
      }
      if (reason === 'logout') {
        clearSession();
        showAlert('Anda telah keluar dari sistem.', 'success');
        return;
      }

      if (getValidToken()) {
        showAlert('Sesi aktif terdeteksi. Mengalihkan ke dashboard...', 'success');
        setTimeout(() => { window.location.replace('/'); }, 400);
      } else {
        // Bersihkan sisa token rusak/kedaluwarsa
        clearSession();
      }
    });
  </script>
</body>
</html>
