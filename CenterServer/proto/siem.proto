syntax = "proto3";

package proto;
option go_package = "server3/proto";

message LogPacket {
    string agent_name = 1;
    bytes payload_json = 2;
}

message HeartbeatPacket {
    string agent_name = 1;
    bytes payload_json = 2;
}

message Ack {
    bool success = 1;
}

service IngestionService {
    rpc StreamLogs (stream LogPacket) returns (Ack);
    rpc SendHeartbeat (HeartbeatPacket) returns (Ack);
}